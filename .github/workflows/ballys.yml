name: Update Ballys M3U & EPG

on:
  schedule:
    # Every 4 hours starting 9:00 PM CDT (UTC-5) = 02:00 UTC
    - cron: "0 2,6,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scrape_ballys.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ballys.m3u ballys.xml
          git diff --cached --quiet || git commit -m "Update Ballys playlist/EPG $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
